<!DOCTYPE html>

    <style>
      @font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url('/fonts/Inter-Regular.ttf') format('truetype'); }

      html, body { height: 100%; margin: 0; }
      .skip { position: absolute; top: 8px; left: 8px; padding: 10px 16px; border-radius: 12px; background: #0A0B0D; color: #A4EB3F; font-weight: 700; text-decoration: none; transform: translateY(-200%); }
      .skip:focus { transform: none; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #F6F7FB; color: #0A0B0D;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 360px; padding: 24px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 24px; font-weight: 800; }
      p { margin: 0 0 24px; color: #556274; line-height: 1.5; }
      a {
        display: inline-block; padding: 12px 24px; border-radius: 9999px;
        background: #A4EB3F; color: #0A0B0D; font-weight: 700; text-decoration: none;
      }
      img { display: block; width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px; }
      a { transition: background-color 160ms ease, color 160ms ease, transform 160ms ease; }
      a:hover { background: #0A0B0D; color: #A4EB3F; }
      a:active { transform: scale(0.97); }
      a:focus-visible { outline: 2px solid #0A0B0D; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } a:active { transform: none; } }
    </style>
