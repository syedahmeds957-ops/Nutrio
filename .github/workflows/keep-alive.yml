name: Supabase Keep-Alive

# Supabase free projects pause after 7 days of inactivity.
# This workflow pings the project every 3 days to keep it permanently awake.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL secret is not set yet. Skipping ping."
            exit 0
          fi
          curl -s -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null || echo "Ping dispatched"
