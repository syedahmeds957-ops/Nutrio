name: Weekly Database Backup

# Supabase free tier does not include automated backups.
# This workflow runs a weekly pg_dump and uploads the compressed backup as an artifact.
on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret is not configured yet. Skipping backup."
            exit 0
          fi
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          pg_dump "$SUPABASE_DB_URL" --clean --if-exists -F p | gzip > "nutrio_backup_${TIMESTAMP}.sql.gz"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-weekly-backup
          path: nutrio_backup_*.sql.gz
          retention-days: 30
